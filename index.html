cv.onpointermove=e=>{if(!down||s.st!=='play')return;const p=pos(e),l=trail[trail.length-1]||p;trail.push(p);if(trail.length>8)trail.shift();
s.f.forEach(f=>{if(f.cut||s.st!=='play')return;const dx=p.x-l.x,dy=p.y-l.y,len=dx*dx+dy*dy||1,t=Math.max(0,Math.min(1,((f.x-l.x)*dx+(f.y-l.y)*dy)/len)),d=Math.hypot(l.x+t*dx-f.x,l.y+t*dy-f.y);
if(d<28){f.cut=1;if(f.bomb){s.st='over';end()}else{s.sc++;$('#sc').textContent=s.sc;for(let i=0;i<8;i++)s.parts.push({x:f.x,y:f.y,vx:(Math.random()-.5)*6,vy:(Math.random()-.5)*6,t:30})}}})};
const loop=()=>{if(s.st==='play'){s.t++;if(s.t%Math.max(25,60-s.sc)===0){const n=1+(Math.random()*Math.min(3,1+s.sc/15)|0);for(let i=0;i<n;i++)s.f.push({x:60+Math.random()*(W-120),y:H+20,vx:(Math.random()-.5)*3,vy:-(10+Math.random()*3),e:FR[Math.random()*FR.length|0],bomb:Math.random()<.15})}
s.f.forEach(f=>{f.vy+=.22;f.x+=f.vx;f.y+=f.vy});s.f=s.f.filter(f=>{if(f.y>H+40){if(!f.cut&&!f.bomb&&s.st==='play'){s.lives--;if(s.lives<=0){s.st='over';end()}}return false}return !f.cut})}
s.parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.t--});s.parts=s.parts.filter(p=>p.t>0);
$('#lv').textContent='❤️'.repeat(Math.max(0,s.lives));x.fillStyle='#3f2a14';x.fillRect(0,0,W,H);x.font='40px serif';x.textAlign='center';x.textBaseline='middle';s.f.forEach(f=>x.fillText(f.bomb?'💣':f.e,f.x,f.y));
x.fillStyle='#fde047';s.parts.forEach(p=>x.fillRect(p.x,p.y,4,4));if(trail.length>1){x.strokeStyle='#fff';x.lineWidth=4;x.beginPath();trail.forEach((p,i)=>i?x.lineTo(p.x,p.y):x.moveTo(p.x,p.y));x.stroke()}
if(s.st==='play'&&s.t<120){x.fillStyle='#fff';x.font='bold 20px Roboto';x.fillText('Drag to slice!',W/2,60)}x.textBaseline='alphabetic';raf=requestAnimationFrame(loop)};loop();return()=>cancelAnimationFrame(raf)},
racer(box){const W=300,H=500,LW=100;box.style.maxWidth='300px';box.innerHTML='<div class="hud"><span>Score: <b id="sc">0</b></span><span>Best: '+(best('racer')||0)+'</span></div><canvas width="300" height="500"></canvas>';
const cv=box.querySelector('canvas'),x=cv.getContext('2d');let s,raf;const reset=()=>{s={lane:1,px:150,c:[],t:0,sp:4,sc:0,st:'ready',off:0};$('#sc').textContent=0};reset();
const mv=d=>{if(s.st==='over'){reset();return}s.st='play';s.lane=Math.max(0,Math.min(2,s.lane+d))};
const k=e=>{if(e.target===q)return;if(e.key==='ArrowLeft'||e.key==='a'){e.preventDefault();mv(-1)}if(e.key==='ArrowRight'||e.key==='d'){e.preventDefault();mv(1)}};addEventListener('keydown',k);
cv.onpointerdown=e=>{const r=cv.getBoundingClientRect();mv((e.clientX-r.left)<r.width/2?-1:1)};
const loop=()=>{if(s.st==='play'){s.t++;s.sp+=.002;s.off=(s.off+s.sp)%40;s.px+=(s.lane*LW+50-s.px)*.3;
if(s.t%Math.max(28,70-(s.sp*4|0))===0){const l=Math.random()*3|0;s.c.push({l,y:-60});if(Math.random()<.3)s.c.push({l:(l+1+(Math.random()*2|0))%3,y:-60})}
s.c.forEach(c=>c.y+=s.sp);s.c=s.c.filter(c=>{if(c.y>H){s.sc++;$('#sc').textContent=s.sc;return false}return true});
if(s.c.some(c=>Math.abs(c.l*LW+50-s.px)<40&&c.y+50>H-90&&c.y<H-30)){s.st='over';save('racer',s.sc)}}
x.fillStyle='#374151';x.fillRect(0,0,W,H);x.fillStyle='#f8fafc';for(let i=1;i<3;i++)for(let y=-40+s.off;y<H;y+=40)x.fillRect(i*LW-2,y,4,22);
x.font='44px serif';x.textAlign='center';s.c.forEach(c=>x.fillText('🚙',c.l*LW+50,c.y+44));x.fillText('🏎️',s.px,H-38);
x.fillStyle='#fff';x.font='bold 20px Roboto';if(s.st==='ready')x.fillText('← → or tap sides to steer',W/2,H/2);if(s.st==='over'){x.fillText('Crash! Score '+s.sc,W/2,H/2);x.fillText('Tap to retry',W/2,H/2+30)}
raf=requestAnimationFrame(loop)};loop();return()=>{cancelAnimationFrame(raf);removeEventListener('keydown',k)}},
lights(box){const N=5;let b,moves;const tip='<p style="font-size:14px;font-weight:400;color:#a9b6e0">Turn off every light. Tapping a light flips it and its neighbours.</p>';box.style.maxWidth='380px';box.innerHTML='<div class="hud"><span>Moves: <b id="mv">0</b></span><span>Best: '+(best('lights')||'\u2014')+'</span></div><div id="bd" style="display:grid;grid-template-columns:repeat(5,1fr);gap:8px"></div><div class="msg" id="m"></div>';
const tog=i=>{const r=i/N|0,c=i%N;[[0,0],[1,0],[-1,0],[0,1],[0,-1]].forEach(([dr,dc])=>{const rr=r+dr,cc=c+dc;if(rr>=0&&rr<N&&cc>=0&&cc<N)b[rr*N+cc]^=1})};
const draw=()=>{$('#mv').textContent=moves;$('#bd').innerHTML=b.map((v,i)=>'<button class="cell" data-i="'+i+'" style="border-radius:12px;background:'+(v?'#facc15':'#13235c')+';box-shadow:'+(v?'0 0 18px #facc15aa':'none')+'"></button>').join('');document.querySelectorAll('#bd .cell').forEach(e=>e.onclick=()=>press(+e.dataset.i))};
const press=i=>{if(b.every(v=>!v))return;tog(i);moves++;draw();if(b.every(v=>!v)){save('lights',moves,true);$('#m').innerHTML='<p>All lights out in '+moves+' moves! 🎉</p><button class="btn pri" id="go">New puzzle</button>';$('#go').onclick=reset}};
const reset=()=>{b=Array(N*N).fill(0);for(let i=0;i<12;i++)tog(Math.random()*N*N|0);if(b.every(v=>!v))tog(12);moves=0;$('#m').innerHTML=tip;draw()};reset()}};
const route=()=>{clearInterval(ptT);cleanup();cleanup=()=>{};sg.style.display='none';const m=location.hash.match(/^#\/play\/(.+)$/);m?play(m[1]):home();scrollTo(0,0)};
addEventListener('hashchange',route);route();loadStats();
