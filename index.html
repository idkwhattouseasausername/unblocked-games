<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Unblocked Games</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--blue:#1a56db;--navy:#13235c;--navy2:#0f1d4d;--fg:#fff;--dim:#a9b6e0;--yel:#facc15;--red:#e11d2a}
*{box-sizing:border-box;margin:0}body{background:var(--navy);color:var(--fg);font-family:Roboto,sans-serif;min-height:100vh;display:flex;flex-direction:column}
a{color:inherit;text-decoration:none}button{font:inherit;cursor:pointer}
header{background:var(--blue);position:sticky;top:0;z-index:20;box-shadow:0 2px 10px #0004}
.hd{max-width:1400px;margin:0 auto;padding:12px 18px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.search{position:relative;flex:1;min-width:240px;max-width:650px}
.search input{width:100%;height:52px;border-radius:14px;border:0;padding:0 44px 0 48px;font-size:17px;font-family:inherit;outline:none}
.search .ic{position:absolute;left:16px;top:14px;font-size:20px;color:#667}
.search .x{position:absolute;right:14px;top:12px;border:0;background:none;font-size:20px;color:#667;display:none}
.sugg{position:absolute;top:58px;left:0;right:0;background:#fff;color:#111;border-radius:12px;box-shadow:0 10px 30px #0006;overflow:hidden;display:none}
.sugg a{display:flex;gap:12px;align-items:center;padding:8px 12px}.sugg a:hover{background:#eef2ff}
.sugg .t{width:42px;height:42px;border-radius:8px;display:grid;place-items:center;font-size:22px}.sugg b{font-size:14px;display:block}.sugg small{color:#667;font-size:11px}
.hbtn{margin-left:auto;display:flex;gap:10px;flex-wrap:wrap}
.hb{background:var(--navy2);color:#fff;border:1px solid #ffffff22;border-radius:12px;height:46px;padding:0 16px;font-weight:700;font-size:16px;position:relative}
.menu{position:absolute;right:0;top:52px;background:#fff;color:#111;border-radius:12px;box-shadow:0 10px 30px #0006;min-width:180px;display:none;overflow:hidden;text-align:left}
.menu button{display:block;width:100%;border:0;background:none;padding:10px 16px;text-align:left;font-weight:500}.menu button:hover{background:#eef2ff}
main{flex:1;max-width:1400px;margin:0 auto;padding:0 22px 40px;width:100%}
.hero{font-size:clamp(34px,6vw,64px);font-weight:900;text-align:center;padding:44px 0 34px;letter-spacing:-1.5px}
.sec{margin-bottom:34px}.sh{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:12px}
.sh h2{font-size:24px;font-weight:700}.sh p{color:var(--dim);font-size:13px}
.arr button{width:38px;height:38px;border-radius:10px;border:1px solid #ffffff33;background:var(--blue);color:#fff;font-size:18px;margin-left:6px}
.row{display:flex;gap:12px;overflow-x:auto;scroll-behavior:smooth;scrollbar-width:none;padding-bottom:4px}.row::-webkit-scrollbar{display:none}
.row .card{flex:0 0 220px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.card{background:#fff;color:#111;border-radius:14px;overflow:hidden;transition:transform .15s,box-shadow .15s;display:block}
.card:hover{transform:translateY(-4px);box-shadow:0 10px 24px #0007}
.th{height:142px;display:grid;place-items:center;font-size:64px;position:relative;text-shadow:0 4px 10px #0004}
.th .nm{position:absolute;bottom:8px;left:0;right:0;text-align:center;font-weight:900;font-size:22px;color:#fff;text-shadow:0 2px 0 #000,0 0 8px #000;letter-spacing:1px;text-transform:uppercase}
.bd{position:absolute;left:10px;display:flex;flex-direction:column;gap:6px;top:10px;align-items:flex-start}
.bdg{font-size:10px;font-weight:900;padding:4px 8px;border-radius:5px;letter-spacing:.5px}.bdg.n{background:var(--red);color:#fff}.bdg.t{background:var(--yel);color:#111}
.ct{padding:14px 10px;text-align:center;font-weight:700;font-size:15px;min-height:62px;display:grid;place-items:center}
.count{color:var(--dim);font-size:13px;font-weight:700;margin:6px 0 12px}
.play-top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:22px 0}
.play-top h1{font-size:30px;font-weight:900}
.stage{background:var(--navy2);border:1px solid #ffffff1a;border-radius:16px;padding:24px;display:flex;justify-content:center;min-height:500px}
.ctl{color:var(--dim);font-size:13px;margin-top:-12px;margin-bottom:14px}
.hud{display:flex;justify-content:space-between;font-size:14px;font-weight:700;margin-bottom:8px}.hud b{color:var(--yel)}
.box{width:100%;max-width:420px;user-select:none;touch-action:none}
.cells{display:grid;gap:6px;background:#0a1438;padding:8px;border-radius:10px}
.cell{aspect-ratio:1;border-radius:6px;display:grid;place-items:center;font-weight:700;border:0;color:#fff;font-size:22px;cursor:pointer;background:#ffffff0d}
.msg{text-align:center;margin-top:16px}.msg p{font-size:20px;font-weight:700;margin-bottom:8px}
.btn{border:0;border-radius:10px;height:42px;padding:0 18px;font-weight:700;background:var(--navy2);color:#fff;border:1px solid #ffffff33}.btn.pri{background:var(--yel);color:#111;border:0}
canvas{width:100%;border-radius:10px;display:block}
.more{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;margin-top:28px}
.acts{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;background:var(--navy2);border:1px solid #ffffff1a;border-radius:14px;padding:10px;margin-top:12px}
.acts .grp{display:flex;gap:8px;flex-wrap:wrap}
.ab{display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 16px;border-radius:999px;border:1px solid #ffffff26;background:#ffffff0d;color:#fff;font-weight:700;font-size:15px;transition:transform .12s,background .15s,border-color .15s}
.ab:hover{background:#ffffff1f;transform:translateY(-1px)}.ab:active{transform:scale(.95)}
.ab .i{font-size:18px;transition:transform .25s}.ab.on .i{transform:scale(1.25)}
.ab.like.on{background:#e11d2a;border-color:#e11d2a}.ab.dis.on{background:#475569;border-color:#475569}
.ab.save.on{background:var(--yel);color:#111;border-color:var(--yel)}.ab.fs{background:var(--blue);border-color:var(--blue)}
.ab.icon{width:44px;padding:0;justify-content:center}
.stage:fullscreen{align-items:center;background:#0a1438;border-radius:0}
.stage:fullscreen .box{max-width:min(92vh,720px)!important}
.pop{position:relative}.share{position:absolute;bottom:52px;right:0;background:#fff;color:#111;border-radius:14px;box-shadow:0 12px 30px #0007;padding:8px;min-width:200px;display:none;z-index:10}
.share button{display:flex;gap:10px;align-items:center;width:100%;border:0;background:none;padding:10px 12px;border-radius:8px;font-weight:600;text-align:left}.share button:hover{background:#eef2ff}
#toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,40px);opacity:0;background:#fff;color:#111;font-weight:700;padding:12px 20px;border-radius:999px;box-shadow:0 10px 30px #0008;transition:.25s;z-index:99;pointer-events:none}
#toast.on{opacity:1;transform:translate(-50%,0)}
.heart{position:absolute;right:10px;top:10px;font-size:20px;filter:drop-shadow(0 2px 3px #0008)}
.chips{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;margin:-10px 0 30px;padding:4px 2px}.chips::-webkit-scrollbar{display:none}
.cc{flex:0 0 auto;display:flex;align-items:center;gap:8px;height:46px;padding:0 18px;border-radius:999px;background:var(--navy2);border:1px solid #ffffff22;color:#fff;font-weight:700;font-size:15px;transition:.15s}
.cc:hover{border-color:var(--yel)}.cc.on{background:var(--yel);color:#111;border-color:var(--yel)}.cc small{opacity:.6;font-weight:500}
footer{text-align:center;color:var(--dim);font-size:13px;padding:24px;border-top:1px solid #ffffff1a}
</style></head><body>

<script>

const row=(id,title,sub,list)=>'<div class="sec"><div class="sh"><div><h2>'+title+'</h2><p>'+sub+'</p></div><div class="arr"><button data-r="'+id+'" data-d="-1">←</button><button data-r="'+id+'" data-d="1">→</button></div></div><div class="row" id="'+id+'">'+list.map(card).join('')+'</div></div>';
function home(){const app=$('#app');const list=GAMES.filter(g=>cat==='All'||g.c===cat);
app.innerHTML='<div class="hero">Play games instantly!</div><div class="chips">'+CATS.map(c=>'<button class="cc '+(c===cat?'on':'')+'" data-cc="'+c+'">'+(ICON[c]||'🎮')+' '+c+' <small>'+(c==='All'?GAMES.length:GAMES.filter(g=>g.c===c).length)+'</small></button>').join('')+'</div>'+(cat==='All'?(saved().length?row('sv','❤️ Saved Games','Your favourites, saved on this device',GAMES.filter(g=>saved().includes(g.id))):'')+row('tr','Trending Now','Most played right now',GAMES.filter(g=>g.tr))+row('nw','New Games','Fresh additions to the library',GAMES.filter(g=>g.nw)):'<div class="sh"><h2>'+cat+' games</h2></div>')+'<div class="count">'+list.length+' games shown</div><div class="grid">'+list.map(card).join('')+'</div>';
document.querySelectorAll('[data-cc]').forEach(b=>b.onclick=()=>{cat=b.dataset.cc;home()});document.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{$('#'+b.dataset.r).scrollLeft+=b.dataset.d*700})}
const LS=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}};
const saved=()=>LS('ug-saved',[]);const likes=()=>LS('ug-likes',{});
const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('on'),2200)};
function play(id){const g=GAMES.find(x=>x.id===id);if(!g)return home();const url=location.href;
$('#app').innerHTML='<div class="play-top"><a class="btn" style="display:grid;place-items:center" href="#/">← Back</a><h1>'+g.e+' '+g.t+'</h1><span class="ctl" style="margin:0">'+g.c+'</span></div><p class="ctl">Controls: '+g.k+' · Press <b>F</b> for fullscreen</p><div class="stage" id="stage"><div class="box" id="box"></div></div>'+
'<div class="acts"><div class="grp"><button class="ab like" id="lk"><span class="i">👍</span><span>Like</span></button><button class="ab dis" id="dl"><span class="i">👎</span></button><button class="ab save" id="sv"><span class="i">❤️</span><span id="svt">Save</span></button>'+
'<div class="pop"><button class="ab" id="sh"><span class="i">🔗</span><span>Share</span></button><div class="share" id="shm"><button data-s="copy">📋 Copy link</button><button data-s="native">📤 Share…</button><button data-s="x">𝕏 Post on X</button><button data-s="wa">💬 WhatsApp</button><button data-s="mail">✉️ Email</button></div></div></div>'+

'<div class="sh" style="margin-top:28px"><h2>More games</h2></div><div class="more">'+GAMES.filter(x=>x.id!==id).slice(0,6).map(card).join('')+'</div>';
const paint=()=>{const v=likes()[id];$('#lk').classList.toggle('on',v===1);$('#dl').classList.toggle('on',v===-1);const s=saved().includes(id);$('#sv').classList.toggle('on',s);$('#svt').textContent=s?'Saved':'Save'};
const vote=n=>{const l=likes();l[id]=l[id]===n?0:n;localStorage.setItem('ug-likes',JSON.stringify(l));paint();if(l[id]===1)toast('👍 Thanks for the like!');if(l[id]===-1)toast('Got it — we\'ll show you other games')};
$('#lk').onclick=()=>vote(1);$('#dl').onclick=()=>vote(-1);
$('#sv').onclick=()=>{let s=saved();const on=s.includes(id);s=on?s.filter(x=>x!==id):[id,...s];localStorage.setItem('ug-saved',JSON.stringify(s));paint();toast(on?'Removed from Saved':'❤️ Saved — find it on the home page')};
const fs=()=>{const st=$('#stage');document.fullscreenElement?document.exitFullscreen():st.requestFullscreen&&st.requestFullscreen()};$('#fs').onclick=fs;
const fk=e=>{if((e.key==='f'||e.key==='F')&&e.target!==q)fs()};addEventListener('keydown',fk);
const fc=()=>{const b=$('#fs');if(b)b.lastChild.textContent=document.fullscreenElement?'Exit':'Fullscreen'};document.addEventListener('fullscreenchange',fc);
$('#sh').onclick=e=>{e.stopPropagation();const m=$('#shm');m.style.display=m.style.display==='block'?'none':'block'};
const copy=()=>navigator.clipboard.writeText(url).then(()=>toast('🔗 Link copied!'),()=>toast('Couldn\'t copy — copy it from the address bar'));
$('#shm').onclick=e=>{const s=e.target.closest('[data-s]');if(!s)return;const t='Play '+g.t+' free in your browser!';$('#shm').style.display='none';
({copy,native:()=>navigator.share?navigator.share({title:g.t,text:t,url}).catch(()=>{}):copy(),
x:()=>open('https://twitter.com/intent/tweet?text='+encodeURIComponent(t)+'&url='+encodeURIComponent(url)),
wa:()=>open('https://wa.me/?text='+encodeURIComponent(t+' '+url)),
mail:()=>open('mailto:?subject='+encodeURIComponent(g.t)+'&body='+encodeURIComponent(t+' '+url))})[s.dataset.s]()};
const close=e=>{if(!e.target.closest('.pop')&&$('#shm'))$('#shm').style.display='none'};document.addEventListener('click',close);
paint();const run=()=>{cleanup();$('#box').removeAttribute('style');cleanup=G[id]($('#box'))||(()=>{})};run();$('#rs').onclick=()=>{run();toast('↻ Restarted')};
const inner=cleanup;cleanup=()=>{inner();removeEventListener('keydown',fk);document.removeEventListener('fullscreenchange',fc);document.removeEventListener('click',close)};
const rr=run;$('#rs').onclick=()=>{cleanup();rr();toast('↻ Restarted');const i2=cleanup;cleanup=()=>{i2();removeEventListener('keydown',fk);document.removeEventListener('fullscreenchange',fc);document.removeEventListener('click',close)};addEventListener('keydown',fk);document.addEventListener('fullscreenchange',fc);document.addEventListener('click',close)}}
// header controls
const q=$('#q'),sg=$('#sugg');
q.oninput=()=>{const v=q.value.trim().toLowerCase();$('#qx').style.display=v?'block':'none';const l=GAMES.filter(g=>g.t.toLowerCase().includes(v));
sg.style.display=v?'block':'none';sg.innerHTML=l.length?l.map(g=>'<a href="#/play/'+g.id+'"><span class="t" style="background:linear-gradient(135deg,'+g.g+')">'+g.e+'</span><span><b>'+g.t+'</b><small>Play game</small></span></a>').join(''):'<div style="padding:14px;color:#667">No games found</div>'};
$('#qx').onclick=()=>{q.value='';q.oninput()};document.addEventListener('click',e=>{if(!e.target.closest('.search'))sg.style.display='none';if(!e.target.closest('#catb'))$('#menu').style.display='none'});
$('#rnd').onclick=()=>{location.hash='#/play/'+GAMES[Math.random()*GAMES.length|0].id};
$('#menu').innerHTML=CATS.map(c=>'<button data-c="'+c+'">'+(ICON[c]||'')+' '+c+'</button>').join('');
$('#catb').onclick=e=>{const c=e.target.dataset&&e.target.dataset.c;if(c){cat=c;$('#menu').style.display='none';location.hash='#/';home();return}$('#menu').style.display=$('#menu').style.display==='block'?'none':'block'};
function dirInput(el,cb){const K={ArrowUp:'u',ArrowDown:'d',ArrowLeft:'l',ArrowRight:'r',w:'u',s:'d',a:'l',d:'r'};
const k=e=>{if(e.target===q)return;const d=K[e.key]||K[e.key.toLowerCase()];if(d){e.preventDefault();cb(d)}};let sx,sy;
const ts=e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY};const te=e=>{const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.max(Math.abs(dx),Math.abs(dy))<25)return;cb(Math.abs(dx)>Math.abs(dy)?(dx>0?'r':'l'):(dy>0?'d':'u'))};
addEventListener('keydown',k);el.addEventListener('touchstart',ts,{passive:true});el.addEventListener('touchend',te);return()=>removeEventListener('keydown',k)}
const G={
snake(box){const N=20;let s,f,d,nd,st='ready',t;const V={u:[0,-1],d:[0,1],l:[-1,0],r:[1,0]},O={u:'d',d:'u',l:'r',r:'l'};
const rnd=()=>{let p;do p=[Math.random()*N|0,Math.random()*N|0];while(s.some(c=>c[0]==p[0]&&c[1]==p[1]));return p};
const reset=()=>{s=[[10,10],[9,10],[8,10]];d=nd='r';f=[15,10]};reset();
box.innerHTML='<div class="hud"><span>Score: <b id="sc">0</b></span><span>Best: '+(best('snake')||0)+'</span></div><div class="cells" id="bd" style="grid-template-columns:repeat('+N+',1fr);gap:1px;padding:4px"></div><div class="msg" id="m"></div>';
const cells=[];for(let i=0;i<N*N;i++){const c=document.createElement('div');c.style.aspectRatio=1;c.style.borderRadius='3px';$('#bd').appendChild(c);cells.push(c)}

c4(box){const C=7,R=6;let b,turn,done;box.style.maxWidth='440px';box.innerHTML='<div class="hud"><span>You 🔴</span><span id="st"></span><span>CPU 🟡</span></div><div id="bd" style="display:grid;grid-template-columns:repeat(7,1fr);gap:6px;background:#1d4ed8;padding:10px;border-radius:14px"></div><div class="msg" id="m"></div>';
const win=(b,p)=>{for(let r=0;r<R;r++)for(let c=0;c<C;c++)for(const[dr,dc]of[[0,1],[1,0],[1,1],[1,-1]]){let k=0;for(;k<4;k++){const rr=r+dr*k,cc=c+dc*k;if(rr<0||rr>=R||cc<0||cc>=C||b[rr][cc]!==p)break}if(k===4)return true}return false};
const drop=(b,c,p)=>{for(let r=R-1;r>=0;r--)if(!b[r][c]){b[r][c]=p;return r}return -1};const valid=b=>[...Array(C).keys()].filter(c=>!b[0][c]);
const bot=()=>{const v=valid(b);for(const p of[2,1])for(const c of v){const t=b.map(r=>r.slice());drop(t,c,p);if(win(t,p))return c}const pref=[3,2,4,1,5,0,6].filter(c=>v.includes(c));return Math.random()<.6?pref[0]:v[Math.random()*v.length|0]};

setTimeout(()=>{drop(b,bot(),2);turn=1;draw();if(win(b,2))end('CPU wins 🤖');else if(!valid(b).length)end('Draw')},450)};
const reset=()=>{b=Array.from({length:R},()=>Array(C).fill(0));turn=1;done=false;$('#m').innerHTML='';draw()};reset()},
